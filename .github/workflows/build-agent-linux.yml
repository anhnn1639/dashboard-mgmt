name: Build offline Linux agent

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/**
    paths:
      - agent/tram_agent.py
      - agent/VERSION
      - agent/requirements.txt
      - agent/install-linux.sh
      - agent/build-offline-dependencies.sh
      - agent/tram-agent.service
      - .github/workflows/build-agent-linux.yml

permissions:
  contents: read

jobs:
  build-linux-agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build a glibc 2.17 compatible standalone executable
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            quay.io/pypa/manylinux2014_x86_64 \
            /bin/bash -lc '
              set -euo pipefail
              PYTHON_ARCHIVE=cpython-3.11.15+20260623-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz
              PYTHON_URL=https://github.com/astral-sh/python-build-standalone/releases/download/20260623/cpython-3.11.15%2B20260623-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz
              curl --fail --location --silent --show-error "$PYTHON_URL" --output "/tmp/$PYTHON_ARCHIVE"
              echo "0604cd029b142dc223e131f17f5941c0c8d2d5074997c8178b515b19eea2a6c2  /tmp/$PYTHON_ARCHIVE" | sha256sum --check --strict
              mkdir -p /tmp/tram-python
              tar -xzf "/tmp/$PYTHON_ARCHIVE" -C /tmp/tram-python
              PYTHON=/tmp/tram-python/python/bin/python3
              "$PYTHON" -m pip install --disable-pip-version-check --no-cache-dir -r agent/requirements.txt pyinstaller==6.16.0
              "$PYTHON" -m PyInstaller --noconfirm --clean --onefile --name tram-agent --add-data "agent/VERSION:." agent/tram_agent.py
              chmod 0755 dist/tram-agent
            '

      - name: Validate the executable on every supported distribution family
        run: |
          set -euo pipefail
          bash -n agent/install-linux.sh
          bash -n agent/build-offline-dependencies.sh
          file dist/tram-agent
          readelf -h dist/tram-agent | grep -q 'Machine:.*Advanced Micro Devices X86-64'
          test "$(stat -c '%a' dist/tram-agent)" = "755"
          expected_version="$(tr -d '\r\n' < agent/VERSION)"
          for image in \
            ubuntu:22.04 \
            ubuntu:24.04 \
            oraclelinux:7 \
            oraclelinux:8 \
            registry.access.redhat.com/ubi7/ubi-minimal \
            registry.access.redhat.com/ubi8/ubi-minimal
          do
            echo "Testing $image"
            docker run --rm -v "$PWD/dist/tram-agent:/opt/test/tram-agent:ro" "$image" /opt/test/tram-agent --help >/dev/null
            inventory=$(docker run --rm -v "$PWD/dist/tram-agent:/opt/test/tram-agent:ro" "$image" /opt/test/tram-agent diagnose)
            python3 -c 'import json,sys; data=json.loads(sys.argv[1]); assert data["os_family"] == "linux"; assert data["architecture"] in {"x86_64", "amd64"}; assert data["distribution_id"] in {"ubuntu", "ol", "rhel"}; assert data["agent_version"] == sys.argv[2]' "$inventory" "$expected_version"
          done
          sha256sum dist/tram-agent

      - name: Write release provenance
        shell: bash
        run: |
          mkdir -p release
          install -m 0755 dist/tram-agent release/tram-agent
          python3 -c 'import hashlib,json,pathlib; path=pathlib.Path("release/tram-agent"); version=pathlib.Path("agent/VERSION").read_text(encoding="ascii").strip(); payload={"schema":1,"version":version,"artifactKind":"linux_elf","sha256":hashlib.sha256(path.read_bytes()).hexdigest(),"sizeBytes":path.stat().st_size,"sourceCommit":"${{ github.sha }}","authenticodeSigned":False}; pathlib.Path("release/tram-agent.provenance.json").write_text(json.dumps(payload,sort_keys=True,separators=(",",":"))+"\n",encoding="utf-8")'
          python3 -m json.tool release/tram-agent.provenance.json

      - name: Upload standalone Linux agent
        uses: actions/upload-artifact@v4
        with:
          name: TramVanHanhAgent-linux-x86_64
          path: |
            release/tram-agent
            release/tram-agent.provenance.json
          if-no-files-found: error

  build-linux-offline-dependencies:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile:
          - ubuntu-22.04
          - ubuntu-24.04
          - ol-7
          - ol-8
          - rhel-7
          - rhel-8
    steps:
      - uses: actions/checkout@v4
      - name: Build signed native dependency pack
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          chmod +x agent/build-offline-dependencies.sh
          agent/build-offline-dependencies.sh "${{ matrix.profile }}" release/offline
          python3 -m json.tool "release/offline/${{ matrix.profile }}-x86_64.tar.gz.provenance.json"
      - name: Verify installation with all repositories and network disabled
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          archive="$PWD/release/offline/$PROFILE-x86_64.tar.gz"
          case "$PROFILE" in
            ubuntu-*) image="ubuntu:${PROFILE#ubuntu-}"; package_type=deb ;;
            ol-*) image="oraclelinux:${PROFILE#ol-}-slim"; package_type=rpm ;;
            rhel-7) image=registry.access.redhat.com/ubi7/ubi; package_type=rpm ;;
            rhel-8) image=registry.access.redhat.com/ubi8/ubi; package_type=rpm ;;
          esac
          docker run --rm --network none -v "$archive:/tmp/offline.tar.gz:ro" -e PACKAGE_TYPE="$package_type" "$image" bash -lc '
            set -euo pipefail
            mkdir -p /tmp/offline /tmp/empty-sources
            tar -xzf /tmp/offline.tar.gz --no-same-owner -C /tmp/offline
            if [ "$PACKAGE_TYPE" = deb ]; then
              DEBIAN_FRONTEND=noninteractive apt-get -y --no-download --no-install-recommends \
                -o Dir::Etc::sourcelist=/dev/null -o Dir::Etc::sourceparts=/tmp/empty-sources \
                -o Acquire::Languages=none install /tmp/offline/packages/*.deb
            elif command -v dnf >/dev/null 2>&1; then
              dnf -y --disablerepo="*" install /tmp/offline/packages/*.rpm
            else
              yum -y --disablerepo="*" localinstall /tmp/offline/packages/*.rpm
            fi
            for command in lsblk blkid mount umount findmnt blockdev partx wipefs udevadm parted partprobe sgdisk pvs vgs lvs pvcreate pvresize vgcreate vgextend lvcreate lvextend lvremove mkfs.ext4 resize2fs mkfs.xfs xfs_growfs; do
              command -v "$command" >/dev/null
            done
          '
      - name: Upload offline dependency pack
        uses: actions/upload-artifact@v4
        with:
          name: TramVanHanhAgent-linux-offline-${{ matrix.profile }}-x86_64
          path: |
            release/offline/${{ matrix.profile }}-x86_64.tar.gz
            release/offline/${{ matrix.profile }}-x86_64.tar.gz.provenance.json
          if-no-files-found: error
