name: Build offline Linux agent

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/**
    paths:
      - agent/tram_agent.py
      - agent/VERSION
      - agent/requirements.txt
      - agent/install-linux.sh
      - agent/build-offline-dependencies.sh
      - agent/tram-agent.service
      - .github/workflows/build-agent-linux.yml

permissions:
  contents: read

jobs:
  build-linux-agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build a glibc 2.17 compatible standalone executable
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            quay.io/pypa/manylinux2014_x86_64 \
            /bin/bash -lc '
              set -euo pipefail
              PYTHON_ARCHIVE=cpython-3.11.15+20260623-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz
              PYTHON_URL=https://github.com/astral-sh/python-build-standalone/releases/download/20260623/cpython-3.11.15%2B20260623-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz
              curl --fail --location --silent --show-error "$PYTHON_URL" --output "/tmp/$PYTHON_ARCHIVE"
              echo "0604cd029b142dc223e131f17f5941c0c8d2d5074997c8178b515b19eea2a6c2  /tmp/$PYTHON_ARCHIVE" | sha256sum --check --strict
              mkdir -p /tmp/tram-python
              tar -xzf "/tmp/$PYTHON_ARCHIVE" -C /tmp/tram-python
              PYTHON=/tmp/tram-python/python/bin/python3
              "$PYTHON" -m pip install --disable-pip-version-check --no-cache-dir -r agent/requirements.txt pyinstaller==6.16.0
              "$PYTHON" -m PyInstaller --noconfirm --clean --onefile --name tram-agent --add-data "agent/VERSION:." agent/tram_agent.py
              chmod 0755 dist/tram-agent
            '

      - name: Validate the executable on every supported distribution family
        run: |
          set -euo pipefail
          bash -n agent/install-linux.sh
          bash -n agent/build-offline-dependencies.sh
          file dist/tram-agent
          readelf -h dist/tram-agent | grep -q 'Machine:.*Advanced Micro Devices X86-64'
          test "$(stat -c '%a' dist/tram-agent)" = "755"
          expected_version="$(tr -d '\r\n' < agent/VERSION)"
          for image in \
            ubuntu:22.04 \
            ubuntu:24.04 \
            oraclelinux:7 \
            oraclelinux:8 \
            registry.access.redhat.com/ubi7/ubi-minimal \
            registry.access.redhat.com/ubi8/ubi-minimal
          do
            echo "Testing $image"
            docker run --rm -v "$PWD/dist/tram-agent:/opt/test/tram-agent:ro" "$image" /opt/test/tram-agent --help >/dev/null
            inventory=$(docker run --rm -v "$PWD/dist/tram-agent:/opt/test/tram-agent:ro" "$image" /opt/test/tram-agent diagnose)
            python3 -c 'import json,sys; data=json.loads(sys.argv[1]); assert data["os_family"] == "linux"; assert data["architecture"] in {"x86_64", "amd64"}; assert data["distribution_id"] in {"ubuntu", "ol", "rhel"}; assert data["agent_version"] == sys.argv[2]' "$inventory" "$expected_version"
          done
          sha256sum dist/tram-agent

      - name: Verify managed Ubuntu sources request only Packages indexes
        run: |
          set -euo pipefail
          python3 -m venv /tmp/agent-venv
          /tmp/agent-venv/bin/pip install --disable-pip-version-check --quiet -r agent/requirements.txt
          for release in 22.04 24.04; do
            codename=$([ "$release" = "22.04" ] && echo jammy || echo noble)
            root="$RUNNER_TEMP/apt-$release"
            mkdir -p "$root/apt" "$root/state"
            printf 'deb http://archive.ubuntu.com/ubuntu %s main universe\n' "$codename" > "$root/apt/sources.list"
            # Generate the file exactly as the Agent writes it for Pulp pockets.
            /tmp/agent-venv/bin/python - "$root" "$release" "$codename" <<'PY'
          import importlib.util, sys
          from pathlib import Path
          root, release, codename = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          spec = importlib.util.spec_from_file_location("tram_agent", "agent/tram_agent.py")
          agent = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(agent)
          base = f"http://pulp.invalid/pulp/content/ubuntu/{release}"
          mappings = [{"id": suite, "base_url": f"{base}/{suite}"} for suite in (codename, f"{codename}-updates", f"{codename}-security")]
          code, _ = agent.configure_ubuntu_update_source({"mode": "custom", "repositories": mappings}, {"distribution_id": "ubuntu", "os_version": release}, root / "apt", root / "state")
          assert code == 0
          PY
            docker run --rm -v "$root/apt:/tram-apt:ro" "ubuntu:$release" bash -lc '
              set -euo pipefail
              apt-get -o Dir::Etc::sourcelist=/dev/null -o Dir::Etc::sourceparts=/tram-apt/sources.list.d \
                -o Dir::Etc::parts=/tram-apt/apt.conf.d indextargets --no-release-info --format "\$(CREATED_BY) \$(URI)" > /tmp/targets
              cat /tmp/targets
              grep -q "^Packages http://pulp.invalid/" /tmp/targets
              if grep -v "^Packages " /tmp/targets | grep -q "pulp.invalid"; then
                echo "APT would request non-Packages indexes from the managed source" >&2
                exit 1
              fi
              timeout=$(apt-config -o Dir::Etc::parts=/tram-apt/apt.conf.d dump Acquire::http::Timeout)
              echo "$timeout"
              echo "$timeout" | grep -q "\"15\""
            '
          done

      - name: Write release provenance
        shell: bash
        run: |
          mkdir -p release
          install -m 0755 dist/tram-agent release/tram-agent
          python3 -c 'import hashlib,json,pathlib; path=pathlib.Path("release/tram-agent"); version=pathlib.Path("agent/VERSION").read_text(encoding="ascii").strip(); payload={"schema":1,"version":version,"artifactKind":"linux_elf","sha256":hashlib.sha256(path.read_bytes()).hexdigest(),"sizeBytes":path.stat().st_size,"sourceCommit":"${{ github.sha }}","authenticodeSigned":False}; pathlib.Path("release/tram-agent.provenance.json").write_text(json.dumps(payload,sort_keys=True,separators=(",",":"))+"\n",encoding="utf-8")'
          python3 -m json.tool release/tram-agent.provenance.json

      - name: Upload standalone Linux agent
        uses: actions/upload-artifact@v4
        with:
          name: TramVanHanhAgent-linux-x86_64
          path: |
            release/tram-agent
            release/tram-agent.provenance.json
          if-no-files-found: error

  build-linux-offline-dependencies:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile:
          - ubuntu-22.04
          - ubuntu-24.04
          - ol-7
          - ol-8
    steps:
      - uses: actions/checkout@v4
      - name: Build signed native dependency pack
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          chmod +x agent/build-offline-dependencies.sh
          agent/build-offline-dependencies.sh "${{ matrix.profile }}" release/offline
          python3 -m json.tool "release/offline/${{ matrix.profile }}-x86_64.tar.provenance.json"
      - name: Verify installation with all HTTP repositories and network disabled
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          archive="$PWD/release/offline/$PROFILE-x86_64.tar"
          case "$PROFILE" in
            ubuntu-*) image="ubuntu:${PROFILE#ubuntu-}"; package_type=deb ;;
            ol-7) image=oraclelinux:7-slim; package_type=rpm ;;
            ol-8) image=oraclelinux:8; package_type=rpm ;;
          esac
          docker run --rm --network none -v "$archive:/tmp/offline.tar:ro" -e PACKAGE_TYPE="$package_type" "$image" bash -lc '
            set -euo pipefail
            mkdir -p /tmp/offline
            tar -xf /tmp/offline.tar --no-same-owner -C /tmp/offline
            if [ "$PACKAGE_TYPE" = deb ]; then
              mkdir -p /tmp/offline/empty-sources /tmp/offline/apt-lists/partial /tmp/offline/packages/partial
              printf "deb [trusted=yes] file:/tmp/offline/packages ./\n" > /tmp/offline/offline.list
              apt-get \
                -o APT::Sandbox::User=root \
                -o Dir::Etc::sourcelist=/tmp/offline/offline.list \
                -o Dir::Etc::sourceparts=/tmp/offline/empty-sources \
                -o Dir::State::lists=/tmp/offline/apt-lists \
                -o Dir::Cache::archives=/tmp/offline/packages \
                -o Acquire::Languages=none update
              DEBIAN_FRONTEND=noninteractive apt-get -y --no-download --no-install-recommends \
                -o APT::Sandbox::User=root \
                -o Dir::Etc::sourcelist=/tmp/offline/offline.list \
                -o Dir::Etc::sourceparts=/tmp/offline/empty-sources \
                -o Dir::State::lists=/tmp/offline/apt-lists \
                -o Dir::Cache::archives=/tmp/offline/packages \
                -o Acquire::Languages=none install util-linux parted gdisk lvm2 e2fsprogs xfsprogs udev
            else
              rpmkeys --checksig /tmp/offline/packages/*.rpm
              if command -v dnf >/dev/null 2>&1; then
                dnf -y --disablerepo="*" install /tmp/offline/packages/*.rpm
              else
                yum -y --disablerepo="*" localinstall /tmp/offline/packages/*.rpm
              fi
            fi
            for command in lsblk blkid mount umount findmnt blockdev partx wipefs udevadm parted partprobe sgdisk pvs vgs lvs pvcreate pvresize vgcreate vgextend lvcreate lvextend lvremove mkfs.ext4 resize2fs mkfs.xfs xfs_growfs; do
              command -v "$command" >/dev/null
            done
          '
      - name: Upload offline dependency pack
        uses: actions/upload-artifact@v4
        with:
          name: TramVanHanhAgent-linux-offline-${{ matrix.profile }}-x86_64
          path: |
            release/offline/${{ matrix.profile }}-x86_64.tar
            release/offline/${{ matrix.profile }}-x86_64.tar.provenance.json
          if-no-files-found: error
