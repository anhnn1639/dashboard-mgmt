name: Security audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"
  push:
    branches:
      - main
      - codex/**
    paths:
      - agent/**
      - control-plane/**
      - app/**
      - compose.yaml
      - deploy/Caddyfile
      - deploy/nginx-dashboard.conf.example
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/security-audit.yml

permissions:
  contents: read

jobs:
  edge-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          -e OPS_DOMAIN=ops.example.internal
          -v "$PWD/deploy:/etc/caddy:ro"
          caddy:2-alpine
          caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile
          --pretty

  python-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit pinned Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir pip-audit==2.9.0 bandit==1.8.6
          python -m pip_audit -r control-plane/requirements.txt
          python -m pip_audit -r agent/requirements.txt
      - name: Scan Python code for high-severity security defects
        run: bandit -r control-plane/app agent/tram_agent.py --severity-level high --confidence-level high

  node-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - name: Audit production dashboard dependencies
        run: pnpm audit --prod --audit-level high
