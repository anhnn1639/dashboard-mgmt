name: Security audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"
  push:
    branches:
      - main
      - codex/**
    paths:
      - agent/**
      - control-plane/**
      - web-console-worker/**
      - app/**
      - compose.yaml
      - deploy/Caddyfile
      - deploy/nginx-dashboard.conf.example
      - deploy/deploy-dashboard.sh
      - deploy/verify-api-routes.py
      - tests/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/security-audit.yml

permissions:
  contents: read

jobs:
  web-console-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build isolated browser with Chromium sandbox
        run: docker build -t tram-web-smoke-worker web-console-worker
      - name: Verify internal HTTPS access, recording gate and lease shutdown
        run: python tests/web-smoke/verify.py
      - name: Worker protocol and security regression tests
        run: |
          python -m pip install -r web-console-worker/requirements.txt httpx2==2.11.0
          python -m unittest discover -s web-console-worker -p "test*.py" -v
      - name: Remove disposable web test services
        if: ${{ always() }}
        run: |
          docker rm -f tram-web-worker tram-web-guacd tram-web-fixture || true
          docker network rm tram-web-smoke || true

  managed-ssh-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        profile: [modern, ed25519, rsa-modern, cisco-legacy]
    env:
      SSH_SMOKE_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start disposable SSH target
        run: |
          docker network create tram-smoke-net
          docker build -t tram-smoke-sshd tests/ssh-smoke
          options=()
          case "$SSH_SMOKE_PROFILE" in
            modern) ;;
            ed25519) options=(-o HostKeyAlgorithms=ssh-ed25519) ;;
            rsa-modern) options=(-o HostKeyAlgorithms=rsa-sha2-512,rsa-sha2-256) ;;
            cisco-legacy) options=(-o KexAlgorithms=diffie-hellman-group14-sha1 -o HostKeyAlgorithms=ssh-rsa -o Ciphers=aes128-ctr -o MACs=hmac-sha1) ;;
            *) exit 2 ;;
          esac
          docker run -d --name tram-smoke-sshd --network tram-smoke-net tram-smoke-sshd /usr/sbin/sshd -D -e -o PasswordAuthentication=yes -o PermitRootLogin=no "${options[@]}"
      - name: Verify real SSH, host key rejection and recording
        run: PYTHONPATH=control-plane python tests/ssh-smoke/verify.py
      - name: Remove disposable test services
        if: ${{ always() }}
        run: |
          docker rm -f tram-smoke-sshd tram-smoke-guacd || true
          docker network rm tram-smoke-net || true

  edge-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment script syntax
        run: sh -n deploy/deploy-dashboard.sh
      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          -e OPS_DOMAIN=ops.example.internal
          -v "$PWD/deploy:/etc/caddy:ro"
          caddy:2-alpine
          caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile
          --pretty

  python-security:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tram_test
          POSTGRES_HOST_AUTH_METHOD: trust # Disposable, loopback-only test DB.
          POSTGRES_DB: tram_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U tram_test -d tram_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit pinned Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir pip-audit==2.9.0 bandit==1.8.6
          python -m pip_audit -r control-plane/requirements.txt
          python -m pip_audit -r web-console-worker/requirements.txt
          python -m pip_audit -r agent/requirements.txt
      - name: Scan Python code for high-severity security defects
        if: ${{ always() }}
        run: bandit -r control-plane/app agent/tram_agent.py web-console-worker/browser_worker.py web-console-worker/entrypoint.py --severity-level high --confidence-level high
      - name: Run Agent regression tests on Linux
        if: ${{ always() }}
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -r agent/requirements.txt
          python -m unittest discover -s agent/tests -p "test*.py" -v
      - name: Run API authorization and approval regressions
        if: ${{ always() }}
        env:
          TRAM_TEST_POSTGRES_URL: postgresql+psycopg://tram_test@127.0.0.1:5432/tram_test
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -r control-plane/requirements.txt
          PYTHONPATH=control-plane python -m unittest discover -s control-plane/tests -p "test*.py" -v

  node-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - name: Audit production dashboard dependencies
        run: pnpm audit --prod --audit-level high
      - name: Build and verify role-aware dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm lint
          pnpm test
