name: Security audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"
  push:
    branches:
      - main
      - codex/**
    paths:
      - agent/**
      - control-plane/**
      - web-console-worker/**
      - app/**
      - compose.yaml
      - deploy/Caddyfile
      - deploy/nginx-dashboard.conf.example
      - deploy/deploy-dashboard.sh
      - deploy/verify-api-routes.py
      - deploy/verify-recording-storage.sh
      - deploy/verify-recording-storage.py
      - deploy/verify-guacamole.py
      - deploy/guacamole/**
      - tests/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/security-audit.yml

permissions:
  contents: read

jobs:
  guacamole-frontend-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install disposable browser test dependencies
        run: |
          python -m pip install cryptography==50.0.0
      - name: Build the deployed Guacamole extension
        run: |
          docker build -t portal-guacamole-smoke deploy/guacamole
          docker build -t portal-guacamole-browser web-console-worker
          docker build -t portal-guacamole-sshd tests/ssh-smoke
      - name: Verify real frontend, JSON authentication, MIME, SSH/RDP transport and clipboard errors
        run: python tests/guacamole-smoke/verify.py

  web-console-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Worker protocol and security regression tests
        run: |
          python -m pip install -r web-console-worker/requirements.txt httpx2==2.12.0
          python -m unittest discover -s web-console-worker -p "test*.py" -v
      - name: Build isolated browser with Chromium sandbox
        id: browser_image
        run: docker build -t tram-web-smoke-worker web-console-worker
      - name: Verify saved-account forms and capture recovery in a real sandboxed browser
        if: ${{ !cancelled() && steps.browser_image.outcome == 'success' }}
        run: >-
          docker run --rm --init --read-only --cap-drop=ALL
          --security-opt no-new-privileges --security-opt seccomp=web-console-worker/seccomp_profile.json
          --tmpfs /tmp:rw,nosuid,nodev,size=512m,uid=10002,gid=10002
          --tmpfs /home/worker:rw,nosuid,nodev,size=32m,uid=10002,gid=10002 --shm-size 512m
          -e TRAM_TEST_BROWSER=chromium
          -v "${{ github.workspace }}/web-console-worker/test_auto_login.py:/app/test_auto_login.py:ro"
          -v "${{ github.workspace }}/web-console-worker/test_capture_recovery.py:/app/test_capture_recovery.py:ro"
          --entrypoint python tram-web-smoke-worker -m unittest test_auto_login test_capture_recovery -v
      - name: Verify saved-account SSO login after recording activation
        if: ${{ !cancelled() && steps.browser_image.outcome == 'success' }}
        run: WEB_SMOKE_PROFILE=auto-login python tests/web-smoke/verify.py
      - name: Verify busy-renderer capture recovery preserves recording and saved-account SSO
        if: ${{ !cancelled() && steps.browser_image.outcome == 'success' }}
        run: WEB_SMOKE_PROFILE=auto-login-busy python tests/web-smoke/verify.py
      - name: Verify internal HTTPS access, recording gate and lease shutdown
        if: ${{ !cancelled() && steps.browser_image.outcome == 'success' }}
        run: python tests/web-smoke/verify.py
      - name: Verify automatic certificate handling accepts a stale false flag
        if: ${{ !cancelled() && steps.browser_image.outcome == 'success' }}
        run: WEB_SMOKE_PROFILE=legacy-false python tests/web-smoke/verify.py
      - name: Verify automatic certificate handling without a per-target flag
        if: ${{ !cancelled() && steps.browser_image.outcome == 'success' }}
        run: WEB_SMOKE_PROFILE=untrusted python tests/web-smoke/verify.py
      - name: Verify recorded SSO and automatic redirect discovery across host and port
        if: ${{ !cancelled() && steps.browser_image.outcome == 'success' }}
        run: WEB_SMOKE_PROFILE=redirect python tests/web-smoke/verify.py
      - name: Verify recorded HTTP website without certificate
        if: ${{ !cancelled() && steps.browser_image.outcome == 'success' }}
        run: WEB_SMOKE_PROFILE=http python tests/web-smoke/verify.py
      - name: Verify delayed web fonts do not stop recording or close the browser
        if: ${{ !cancelled() && steps.browser_image.outcome == 'success' }}
        run: WEB_SMOKE_PROFILE=delayed-font python tests/web-smoke/verify.py
      - name: Remove disposable web test services
        if: ${{ always() }}
        run: |
          docker rm -f tram-web-worker tram-web-guacd tram-web-fixture tram-web-forbidden || true
          docker network rm tram-web-smoke || true

  managed-ssh-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        profile: [modern, ed25519, rsa-modern, cisco-legacy]
    env:
      SSH_SMOKE_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start disposable SSH target
        run: |
          docker network create tram-smoke-net
          docker build -t tram-smoke-sshd tests/ssh-smoke
          options=()
          case "$SSH_SMOKE_PROFILE" in
            modern) ;;
            ed25519) options=(-o HostKeyAlgorithms=ssh-ed25519) ;;
            rsa-modern) options=(-o HostKeyAlgorithms=rsa-sha2-512,rsa-sha2-256) ;;
            cisco-legacy) options=(-o KexAlgorithms=diffie-hellman-group14-sha1 -o HostKeyAlgorithms=ssh-rsa -o Ciphers=aes128-ctr -o MACs=hmac-sha1) ;;
            *) exit 2 ;;
          esac
          docker run -d --name tram-smoke-sshd --network tram-smoke-net tram-smoke-sshd /usr/sbin/sshd -D -e -o PasswordAuthentication=yes -o PermitRootLogin=no "${options[@]}"
      - name: Verify real SSH, host key rejection and recording
        run: PYTHONPATH=control-plane python tests/ssh-smoke/verify.py
      - name: Remove disposable test services
        if: ${{ always() }}
        run: |
          docker rm -f tram-smoke-sshd tram-smoke-guacd || true
          docker network rm tram-smoke-net || true

  edge-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment script syntax
        run: |
          sh -n deploy/deploy-dashboard.sh
          sh -n deploy/verify-recording-storage.sh
      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          -e OPS_DOMAIN=ops.example.internal
          -v "$PWD/deploy:/etc/caddy:ro"
          caddy:2-alpine
          caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile
          --pretty

  python-security:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tram_test
          POSTGRES_HOST_AUTH_METHOD: trust # Disposable, loopback-only test DB.
          POSTGRES_DB: tram_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U tram_test -d tram_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit pinned Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir pip-audit==2.9.0 bandit==1.8.6
          python -m pip_audit -r control-plane/requirements.txt
          python -m pip_audit -r web-console-worker/requirements.txt
          python -m pip_audit -r agent/requirements.txt
      - name: Scan Python code for high-severity security defects
        if: ${{ always() }}
        run: bandit -r control-plane/app agent/tram_agent.py web-console-worker/browser_worker.py web-console-worker/restricted_proxy.py web-console-worker/entrypoint.py --severity-level high --confidence-level high
      - name: Run Agent regression tests on Linux
        if: ${{ always() }}
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -r agent/requirements.txt
          python -m unittest discover -s agent/tests -p "test*.py" -v
      - name: Run API authorization and approval regressions
        if: ${{ always() }}
        env:
          TRAM_TEST_POSTGRES_URL: postgresql+psycopg://tram_test@127.0.0.1:5432/tram_test
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -r control-plane/requirements.txt
          PYTHONPATH=control-plane python -m unittest discover -s control-plane/tests -p "test*.py" -v

  node-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - name: Audit production dashboard dependencies
        run: pnpm audit --prod --audit-level high
      - name: Build and verify role-aware dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm lint
          pnpm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify dashboard behavior in Chromium
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          node node_modules/vinext/dist/cli.js start -H 127.0.0.1 -p 3107 > "$RUNNER_TEMP/dashboard-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3107/build-info.json; then break; fi
            sleep 1
          done
          python tests/dashboard-ui/browser.py
