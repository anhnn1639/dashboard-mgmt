services:
  api:
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tramops}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-tramops}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tramops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tramops}
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tramops} -d ${POSTGRES_DB:-tramops}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [control]

volumes:
  postgres_test_data:
