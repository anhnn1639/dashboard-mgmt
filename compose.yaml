name: tram-van-hanh

services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      dashboard:
        condition: service_healthy
      guacamole:
        condition: service_started
    environment:
      OPS_DOMAIN: ${OPS_DOMAIN:?Set OPS_DOMAIN in .env}
    ports:
      # Nginx on the same host owns public 80/443 and proxies HTTPS to this
      # loopback-only listener. Agent mTLS remains end-to-end on 9443.
      - "127.0.0.1:${WEB_BIND_PORT:-3000}:443"
      - "9443:9443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/pki:/etc/caddy/pki:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, control]

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [control]

  api:
    build:
      context: .
      dockerfile: control-plane/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      JWT_SECRET: ${JWT_SECRET:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      BOOTSTRAP_CONFIG_PATH: /var/lib/tram-ops/bootstrap.json
      AGENT_CA_CERT: /run/secrets/agent-ca.crt
      AGENT_CA_KEY: /run/secrets/agent-ca.key
      CADDY_ROOT_CA: /run/server-ca/server-ca.crt
      WEB_TLS_TRUST: ${WEB_TLS_TRUST:-system}
      GUACAMOLE_URL: /guacamole
      GUACAMOLE_JSON_SECRET: ${GUACAMOLE_JSON_SECRET:?Set GUACAMOLE_JSON_SECRET}
      JOB_SECRET_KEY: ${JOB_SECRET_KEY:-}
      ALLOWED_HOSTS: ${OPS_DOMAIN},localhost,127.0.0.1,api
      RECORDING_ROOT: /recordings
      RECORDING_GID: ${RECORDING_GID:-1000}
      TUNNEL_BIND_HOST: tunnel-relay
      TUNNEL_RELAY_HOST: tunnel-relay
      TUNNEL_MAX_SESSIONS_PER_AGENT: 4
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      CLAMAV_TIMEOUT_SECONDS: 900
      FILE_MAX_BYTES: 1073741824
      FILE_TRANSFER_TTL_HOURS: 24
      FILE_STAGING_ROOT: /var/lib/tram-ops/file-staging
      TMPDIR: /var/lib/tram-ops/file-staging
    volumes:
      - ./deploy/pki:/run/ca-src:ro
      # The API receives only Caddy's exported public root. It never mounts
      # caddy_data, which also contains the private internal-CA key.
      - agent_server_ca:/run/server-ca:ro
      # The API reads recordings and removes them only after a second,
      # distinct administrator approves a PostgreSQL-backed delete request.
      - ${RECORDING_DIR:-./recordings}:/recordings
      - api_config:/var/lib/tram-ops
    expose: ["8000"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    group_add:
      # Shared group access is required for approved recording deletion.
      - "${RECORDING_GID:-1000}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/livez')"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      control:
      session:
        aliases: [tunnel-relay]
      identity_egress:
      malware_scan:

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    environment:
      # Official ClamAV defaults are intentionally small (25-100 MiB). Match
      # the dashboard's 1 GiB file-transfer ceiling while keeping a hard cap.
      CLAMD_CONF_StreamMaxLength: 1024M
      CLAMD_CONF_MaxScanSize: 1100M
      CLAMD_CONF_MaxFileSize: 1024M
      CLAMD_CONF_MaxScanTime: 900000
      CLAMD_CONF_ReadTimeout: 900
    expose: ["3310"]
    volumes:
      - clamav_database:/var/lib/clamav
    networks: [malware_scan, signature_egress]

  caddy-ca-export:
    image: caddy:2.11.4-alpine
    user: "0:0"
    restart: unless-stopped
    network_mode: none
    depends_on:
      caddy:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -eu;
        until [ -s /caddy-data/caddy/pki/authorities/local/root.crt ]; do sleep 1; done;
        while :; do
          cp /caddy-data/caddy/pki/authorities/local/root.crt /api-export/server-ca.crt.tmp;
          chmod 0644 /api-export/server-ca.crt.tmp;
          mv /api-export/server-ca.crt.tmp /api-export/server-ca.crt;
          cp /caddy-data/caddy/pki/authorities/local/root.crt /host-export/server-ca.crt.tmp;
          chmod 0644 /host-export/server-ca.crt.tmp;
          mv /host-export/server-ca.crt.tmp /host-export/server-ca.crt;
          sleep 60;
        done
    healthcheck:
      test: ["CMD-SHELL", "test -s /api-export/server-ca.crt && test -s /host-export/server-ca.crt"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    volumes:
      - caddy_data:/caddy-data:ro
      - agent_server_ca:/api-export
      # Mount only the public-output subdirectory. The exporter cannot read or
      # overwrite agent-ca.key and other private material in deploy/pki.
      - ./deploy/pki/public:/host-export

  recording-init:
    image: alpine:3.22
    user: "0:0"
    network_mode: none
    restart: "no"
    command:
      - sh
      - -c
      - >-
        chown -R 1000:${RECORDING_GID:-1000} /recordings &&
        find /recordings -type d -exec chmod 2770 {} + &&
        find /recordings -type f -exec chmod 0640 {} +
    volumes:
      - ${RECORDING_DIR:-./recordings}:/recordings

  guacd:
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    depends_on:
      recording-init:
        condition: service_completed_successfully
    volumes:
      - ${RECORDING_DIR:-./recordings}:/recordings
    expose: ["4822"]
    networks:
      session:
        # Keep the service name stable even when existing Docker endpoints
        # were created without Compose's implicit service-name alias.
        aliases: [guacd]

  guacamole:
    image: tram-guacamole:1.6.0-clipboard-sync
    build:
      context: ./deploy/guacamole
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      guacd:
        condition: service_healthy
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: 4822
      JSON_ENABLED: "true"
      JSON_SECRET_KEY: ${GUACAMOLE_JSON_SECRET:?Set GUACAMOLE_JSON_SECRET}
      WEBAPP_CONTEXT: guacamole
      REMOTE_IP_VALVE_ENABLED: "true"
      RECORDING_ENABLED: "true"
      RECORDING_SEARCH_PATH: /var/lib/guacamole/recordings
    expose: ["8080"]
    volumes:
      - ${RECORDING_DIR:-./recordings}:/var/lib/guacamole/recordings:ro
    group_add:
      # The web application only reads recordings created by guacd.
      - "${RECORDING_GID:-1000}"
    networks:
      session:
        aliases: [guacamole]
      edge:
        aliases: [guacamole]

networks:
  edge:
  control:
    internal: true
  session:
    internal: true
  identity_egress:
  malware_scan:
    internal: true
  signature_egress:

volumes:
  caddy_data:
  caddy_config:
  agent_server_ca:
  api_config:
  clamav_database:
