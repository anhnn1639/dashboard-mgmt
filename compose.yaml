name: tram-van-hanh

services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      dashboard:
        condition: service_healthy
      guacamole:
        condition: service_started
    environment:
      OPS_DOMAIN: ${OPS_DOMAIN:?Set OPS_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "9443:9443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/pki:/etc/caddy/pki:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, control]

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [control]

  api:
    build: ./control-plane
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      JWT_SECRET: ${JWT_SECRET:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      BOOTSTRAP_CONFIG_PATH: /var/lib/tram-ops/bootstrap.json
      AGENT_CA_CERT: /run/secrets/agent-ca.crt
      AGENT_CA_KEY: /run/secrets/agent-ca.key
      CADDY_ROOT_CA: /run/ca-src/server-ca.crt
      GUACAMOLE_URL: /guacamole
      GUACAMOLE_JSON_SECRET: ${GUACAMOLE_JSON_SECRET:?Set GUACAMOLE_JSON_SECRET}
      JOB_SECRET_KEY: ${JOB_SECRET_KEY:-}
      RECORDING_ROOT: /recordings
      TUNNEL_BIND_HOST: tunnel-relay
      TUNNEL_RELAY_HOST: tunnel-relay
      TUNNEL_MAX_SESSIONS_PER_AGENT: 4
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      FILE_MAX_BYTES: 52428800
      FILE_TRANSFER_TTL_HOURS: 24
    volumes:
      - ./deploy/pki:/run/ca-src:ro
      - ${RECORDING_DIR:-./recordings}:/recordings:ro
      - api_config:/var/lib/tram-ops
    expose: ["8000"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/livez')"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      control:
      session:
        aliases: [tunnel-relay]
      identity_egress:
      malware_scan:

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    expose: ["3310"]
    volumes:
      - clamav_database:/var/lib/clamav
    networks: [malware_scan, signature_egress]

  caddy-ca-export:
    image: caddy:2.11.4-alpine
    user: "0:0"
    restart: "no"
    network_mode: none
    depends_on:
      caddy:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -eu;
        until [ -s /caddy-data/caddy/pki/authorities/local/root.crt ]; do sleep 1; done;
        cp /caddy-data/caddy/pki/authorities/local/root.crt /export/server-ca.crt.tmp;
        chmod 0644 /export/server-ca.crt.tmp;
        mv /export/server-ca.crt.tmp /export/server-ca.crt
    volumes:
      - caddy_data:/caddy-data:ro
      - ./deploy/pki:/export

  recording-init:
    image: alpine:3.22
    user: "0:0"
    network_mode: none
    restart: "no"
    command: ["sh", "-c", "chown 1001:1000 /recordings && chmod 2750 /recordings"]
    volumes:
      - ${RECORDING_DIR:-./recordings}:/recordings

  guacd:
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    depends_on:
      recording-init:
        condition: service_completed_successfully
    volumes:
      - ${RECORDING_DIR:-./recordings}:/recordings
    expose: ["4822"]
    networks: [session]

  guacamole:
    image: guacamole/guacamole:1.6.0
    restart: unless-stopped
    depends_on: [guacd]
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: 4822
      JSON_ENABLED: "true"
      JSON_SECRET_KEY: ${GUACAMOLE_JSON_SECRET:?Set GUACAMOLE_JSON_SECRET}
      WEBAPP_CONTEXT: guacamole
      REMOTE_IP_VALVE_ENABLED: "true"
      RECORDING_ENABLED: "true"
      RECORDING_SEARCH_PATH: /var/lib/guacamole/recordings
    expose: ["8080"]
    volumes:
      - ${RECORDING_DIR:-./recordings}:/var/lib/guacamole/recordings:ro
    networks: [session, edge]

networks:
  edge:
  control:
    internal: true
  session:
    internal: true
  identity_egress:
  malware_scan:
    internal: true
  signature_egress:

volumes:
  caddy_data:
  caddy_config:
  api_config:
  clamav_database:
