name: tram-van-hanh

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      dashboard:
        condition: service_healthy
      guacamole:
        condition: service_started
    environment:
      OPS_DOMAIN: ${OPS_DOMAIN:?Set OPS_DOMAIN in .env}
    ports:
      - "80:80"
      - "9443:9443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/pki:/etc/caddy/pki:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, control]

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [control]

  api:
    build: ./control-plane
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      JWT_SECRET: ${JWT_SECRET:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      BOOTSTRAP_CONFIG_PATH: /var/lib/tram-ops/bootstrap.json
      AGENT_CA_CERT: /run/secrets/agent-ca.crt
      AGENT_CA_KEY: /run/secrets/agent-ca.key
      CADDY_ROOT_CA: /caddy-data/caddy/pki/authorities/local/root.crt
      GUACAMOLE_URL: /guacamole
      GUACAMOLE_JSON_SECRET: ${GUACAMOLE_JSON_SECRET:?Set GUACAMOLE_JSON_SECRET}
      JOB_SECRET_KEY: ${JOB_SECRET_KEY:-}
      RECORDING_ROOT: /recordings
    volumes:
      - ./deploy/pki:/run/ca-src:ro
      - recordings:/recordings:ro
      - api_config:/var/lib/tram-ops
      - caddy_data:/caddy-data:ro
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/livez')"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks: [control, session]

  guacd:
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    volumes:
      - recordings:/recordings
    expose: ["4822"]
    networks: [session]

  guacamole:
    image: guacamole/guacamole:1.6.0
    restart: unless-stopped
    depends_on: [guacd]
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: 4822
      JSON_ENABLED: "true"
      JSON_SECRET_KEY: ${GUACAMOLE_JSON_SECRET:?Set GUACAMOLE_JSON_SECRET}
      WEBAPP_CONTEXT: guacamole
      REMOTE_IP_VALVE_ENABLED: "true"
    expose: ["8080"]
    volumes:
      - recordings:/recordings:ro
    networks: [session, edge]

networks:
  edge:
  control:
    internal: true
  session:

volumes:
  recordings:
  caddy_data:
  caddy_config:
  api_config:
